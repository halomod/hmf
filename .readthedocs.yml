# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py


build:
  os: ubuntu-24.04
  tools:
    python: latest

  jobs:
    pre_create_environment:
      # uv from PyPI, not from GitHub releases (which Read the Docs' builders can't
      # always reach), run as a module so that no shim is needed on PATH.
      - python -m pip install uv
    create_environment:
      - python -m uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" python -m uv sync --frozen --group docs
