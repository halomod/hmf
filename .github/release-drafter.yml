# See https://github.com/marketplace/actions/release-drafter for configuration
categories:
  - title: ":boom: Breaking Changes"
    labels:
      - "API Breaking"
  - title: ":rocket: Features"
    labels:
      - "type: feature: ui"
      - "type: feature: physical"
  - title: ":fire: Removals and Deprecations"
    labels:
      - "type: maint: removal"
  - title: ":beetle: Fixes"
    labels:
      - "type: bug"
  - title: ":racehorse: Performance"
    labels:
      - "type: performance: memory"
      - "type: performance: cpu"
      - "type: accuracy"
  - title: ":rotating_light: Testing"
    labels:
      - "type: testing"
  - title: ":construction_worker: Continuous Integration"
    labels:
      - "type: ci"
  - title: ":books: Documentation"
    labels:
      - "type: maint: documentation"
  - title: ":hammer: Refactoring"
    labels:
      - "type: maint: refactoring"
  - title: ":lipstick: Style"
    labels:
      - "type: maint: style"
  - title: ":package: Dependencies"
    labels:
      - "type: maint: dependencies"
      - "type: maint: build"

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Applied by .github/workflows/autolabel.yml. A rule matches if any of its matchers
# does; titles are matched against conventional-commit prefixes.
autolabeler:
  - label: 'type: maint: documentation'
    files:
      - '*.md'
      - '*.rst'
      - 'docs/**/*'
    branch:
      - '/^docs?[/-]/'
    title:
      - '/^docs(\(.+\))?!?:/i'
  - label: 'type: bug'
    branch:
      - '/^fix\//'
    title:
      - '/^fix(\(.+\))?!?:/i'
  - label: "type: maint: removal"
    title:
      - "/^remove /i"
  - label: "type: ci"
    files:
      - '.github/**/*'
      - '.pre-commit-config.yaml'
      - '.coveragerc'
    branch:
      - '/^pre-commit-ci-update-config$/'
    title:
      - '/^ci(\(.+\))?!?:/i'
  - label: "type: testing"
    title:
      - '/^test(\(.+\))?!?:/i'
  - label: "type: maint: style"
    title:
      - '/^style(\(.+\))?!?:/i'
  - label: "type: maint: refactoring"
    title:
      - '/^refactor(\(.+\))?!?:/i'

template: |
  ## Changes

  $CHANGES
