# The configuration of an hmf.core MassFunction (schema version 1): see hmf.core.config.
truncation_rtol = 0.001
delta_c = 1.686
domain_policy = "ignore"

[hmf]
schema_version = 1
stage = "hmf.core.mass_function:MassFunction"

[linear_power]
sigma_8 = 0.8102
species = "cb"
sigma_8_species = "tot"

[linear_power.transfer]
n_s = 0.9665

[linear_power.transfer.cosmology]
class = "FlatLambdaCDM"
name = "Planck18"
H0 = { value = 67.66, unit = "km / (Mpc s)" }
Om0 = 0.30966
Tcmb0 = { value = 2.7255, unit = "K" }
Neff = 3.046
m_nu = { value = [0.0, 0.0, 0.06], unit = "eV" }
Ob0 = 0.04897

[linear_power.transfer.cosmology.meta]
Oc0 = 0.2607
n = 0.9665
sigma8 = 0.8102
tau = 0.0561
z_reion = { value = 7.82, unit = "redshift" }
t0 = { value = 13.787, unit = "Gyr" }
reference = "Planck Collaboration 2018, 2020, A&A, 641, A6  (Paper VI), Table 2 (TT, TE, EE + lowE + lensing + BAO)"

[linear_power.transfer.model]
model = "hmf.core.transfer_models:CAMB"
tail_decay_ln_k = 1.0
k_max = { value = 20.0, unit = "littleh / Mpc" }
z_max = 20.0
dark_energy_model = "fluid"
settings = {}

[linear_power.transfer.k_accuracy]
dln_k = 0.02
ln_k_min = -18.420680743952367
k_max_r_min = 20.0

[linear_power.growth_model]
model = "hmf.core.growth_models:ODEGrowth"
a_min = 1e-08
dln_a = 0.01

[filter]
model = "hmf.core.filters:TopHat"

[mass_accuracy]
dlog10_m = 0.02
log10_m_min = 0.0
log10_m_max = 17.5
extension = "auto"
second_derivative = true

